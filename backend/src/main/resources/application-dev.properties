# Development profile using in-memory H2 database
# Run with: mvn spring-boot:run "-Dspring-boot.run.profiles=dev"

spring.datasource.url=jdbc:h2:mem:food_packaging_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=mySecretKeyForJWTtokenGeneration2024FoodPackagingSystemLongEnough
app.jwt.expiration=86400000
app.ml-service.url=http://localhost:8000
server.port=8080
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
