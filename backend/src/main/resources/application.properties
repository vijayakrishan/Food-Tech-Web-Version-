spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:food_packaging_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:foodpack_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:foodpack_pass}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:mySecretKeyForJWTtokenGeneration2024FoodPackagingSystemLongEnough}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ML Service
app.ml-service.url=${ML_SERVICE_URL:http://localhost:8000}

# Server
server.port=8080

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
